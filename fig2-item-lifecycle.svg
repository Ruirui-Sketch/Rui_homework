<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 570" width="1000" height="570" role="img" aria-label="数字馆藏对象生命周期状态机图">
<defs><marker id="m2a" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 z" fill="#1f4e79"/></marker></defs>
<rect x="0" y="0" width="1000" height="570" fill="#fff"/>
<text x="20" y="26" font-size="16" font-weight="bold" fill="#1f4e79" font-family="Microsoft YaHei,Arial">图 2　状态机图 A：数字馆藏对象（Item / Resource）生命周期</text>
<g font-family="Microsoft YaHei,Arial" font-size="11.5">
<!-- start -->
<circle cx="34" cy="145" r="9" fill="#1f4e79"/>
<text x="20" y="125" fill="#6b7c8f" font-size="10.5">起始</text>
<!-- row1 states -->
<g fill="#eaf2fb" stroke="#2c6da6" stroke-width="1.5">
 <rect x="60" y="110" width="190" height="70" rx="12"/><rect x="290" y="110" width="190" height="70" rx="12"/>
 <rect x="520" y="110" width="200" height="70" rx="12"/><rect x="760" y="110" width="180" height="70" rx="12"/>
</g>
<g fill="#1b2733" font-weight="bold" font-size="12.5">
 <text x="76" y="138">编目记录已建立</text><text x="306" y="138">数字化处理中</text>
 <text x="536" y="138">质量校验 / 权利审查</text><text x="776" y="138">ETL 入库完成</text>
</g>
<g fill="#41556b" font-size="10.5">
 <text x="76" y="158">MARC / MODS 元数据</text><text x="306" y="158">扫描 / 转录 / 派生文件</text>
 <text x="536" y="158">rights_advisory 判定</text><text x="776" y="158">extract_timestamp / group</text>
</g>
<!-- row2 states -->
<g fill="#eaf2fb" stroke="#2c6da6" stroke-width="1.5">
 <rect x="60" y="290" width="190" height="70" rx="12"/><rect x="290" y="290" width="190" height="70" rx="12"/>
 <rect x="520" y="290" width="200" height="70" rx="12"/><rect x="760" y="290" width="180" height="70" rx="12"/>
</g>
<g fill="#1b2733" font-weight="bold" font-size="12.5">
 <text x="76" y="318">已下架 / 撤回</text><text x="306" y="318">可公开访问</text>
 <text x="536" y="318">已发布</text><text x="776" y="318">已建索引</text>
</g>
<g fill="#41556b" font-size="10.5">
 <text x="76" y="338">URL 重定向或 410</text><text x="306" y="338">digitized=true</text>
 <text x="536" y="338">/item /resource 可见</text><text x="776" y="338">facets / results 可读</text>
</g>
<!-- branch states -->
<g fill="#fff6e9" stroke="#b2600f" stroke-width="1.5">
 <rect x="60" y="450" width="190" height="66" rx="12"/><rect x="290" y="450" width="190" height="66" rx="12"/>
 <rect x="520" y="450" width="200" height="66" rx="12"/>
</g>
<g fill="#1b2733" font-weight="bold" font-size="12.5">
 <text x="76" y="478">仅书目（未数字化）</text><text x="306" y="478">受限访问</text><text x="536" y="478">重新抽取 / 修订</text>
</g>
<g fill="#8a5312" font-size="10.5">
 <text x="76" y="498">digitized=false</text><text x="306" y="498">access_restricted=true</text><text x="536" y="498">ETL 触发，版本更新</text>
</g>
</g>
<!-- transitions row1 -->
<g stroke="#1f4e79" stroke-width="1.5" fill="none" marker-end="url(#m2a)" font-family="Microsoft YaHei,Arial" font-size="10.5">
 <line x1="44" y1="145" x2="60" y2="145"/>
 <line x1="250" y1="145" x2="290" y2="145"/><line x1="480" y1="145" x2="520" y2="145"/><line x1="720" y1="145" x2="760" y2="145"/>
 <line x1="850" y1="180" x2="850" y2="290"/>
 <line x1="760" y1="325" x2="720" y2="325"/><line x1="520" y1="325" x2="480" y2="325"/><line x1="290" y1="325" x2="250" y2="325"/>
 <polyline points="155,180 270,180 270,483 250,483"/>
 <line x1="385" y1="360" x2="385" y2="450"/>
 <line x1="385" y1="450" x2="385" y2="360" stroke-dasharray="5 4"/>
 <line x1="620" y1="360" x2="620" y2="450"/>
 <polyline points="720,483 975,483 975,145 940,145"/>
 <line x1="60" y1="325" x2="44" y2="325"/>
</g>
<g font-family="Microsoft YaHei,Arial" font-size="10.5" fill="#41556b" paint-order="stroke" stroke="#fff" stroke-width="3" stroke-linejoin="round">
 <text x="270" y="100" text-anchor="middle">数字化启动</text>
 <text x="500" y="100" text-anchor="middle">校验通过 [rights_ok]</text>
 <text x="740" y="100" text-anchor="middle">ETL 提交</text>
 <text x="856" y="238">写入索引</text>
 <text x="740" y="375" text-anchor="middle">索引就绪</text>
 <text x="500" y="375" text-anchor="middle">发布 [!restricted]</text>
 <text x="262" y="378" text-anchor="end">可访问</text>
 <text x="155" y="375" text-anchor="middle" fill="#8a5312">撤回 / 权利变更</text>
 <text x="162" y="255">[未数字化] 仅展示书目</text>
 <text x="404" y="412">[rights/onsite] 降级为低清缩略图</text>
 <text x="404" y="443" fill="#8a5312">[解除限制] 恢复</text>
 <text x="628" y="410">[重新抽取] 修订</text>
 <text x="770" y="475" fill="#8a5312">重新入库 → 重新索引</text>
</g>
<!-- final -->
<circle cx="34" cy="325" r="10" fill="none" stroke="#1f4e79" stroke-width="1.5"/>
<circle cx="34" cy="325" r="5" fill="#1f4e79"/>
<g font-family="Microsoft YaHei,Arial" font-size="10.5" fill="#6b7c8f">
 <text x="20" y="540">守卫条件取自实际字段：digitized / access_restricted / display_offsite / download_restricted；动作对应 ETL 的 extract_timestamp、group 更新。</text>
 <text x="20" y="558">课程对照：D7 状态建模；A8 演进兼容（下架用重定向而非删除）；I10 稳定标识（撤回后 URL 仍可解析）。</text>
</g>
</svg>