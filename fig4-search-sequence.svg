<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 650" width="1000" height="650" role="img" aria-label="检索与条目详情顺序图">
<defs>
 <marker id="m4a" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 z" fill="#1f4e79"/></marker>
 <marker id="m4b" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 z" fill="#7a8b9c"/></marker>
</defs>
<rect x="0" y="0" width="1000" height="650" fill="#fff"/>
<text x="20" y="26" font-size="16" font-weight="bold" fill="#1f4e79" font-family="Microsoft YaHei,Arial">图 4　顺序图 A：检索 → 分面 → 条目详情 → 资源列表</text>
<!-- participants -->
<g font-family="Microsoft YaHei,Arial" font-size="11" text-anchor="middle">
 <g fill="#eaf6f3" stroke="#1f7a76"><rect x="18" y="52" width="140" height="46" rx="5"/><rect x="178" y="52" width="140" height="46" rx="5"/></g>
 <g fill="#fdf1e6" stroke="#b2600f"><rect x="338" y="52" width="140" height="46" rx="5"/><rect x="498" y="52" width="140" height="46" rx="5"/></g>
 <g fill="#eaf2fb" stroke="#2c6da6"><rect x="658" y="52" width="140" height="46" rx="5"/><rect x="818" y="52" width="164" height="46" rx="5"/></g>
 <g fill="#1b2733" font-weight="bold">
  <text x="88" y="72">研究者 /</text><text x="88" y="90">第三方客户端</text>
  <text x="248" y="72">CDN /</text><text x="248" y="90">边缘缓存</text>
  <text x="408" y="72">«control»</text><text x="408" y="90">QueryController</text>
  <text x="568" y="72">«control»</text><text x="568" y="90">SearchService</text>
  <text x="728" y="72">«entity»</text><text x="728" y="90">SearchIndex 读模型</text>
  <text x="900" y="72">«entity»</text><text x="900" y="90">ItemRepository / Assembler</text>
 </g>
</g>
<g stroke="#9fb2c4" stroke-width="1.1" stroke-dasharray="5 5">
 <line x1="88" y1="98" x2="88" y2="580"/><line x1="248" y1="98" x2="248" y2="580"/>
 <line x1="408" y1="98" x2="408" y2="580"/><line x1="568" y1="98" x2="568" y2="580"/>
 <line x1="728" y1="98" x2="728" y2="580"/><line x1="900" y1="98" x2="900" y2="580"/>
</g>
<!-- activation bars -->
<g fill="#dceafb" stroke="#2c6da6" stroke-width="1">
 <rect x="402" y="130" width="12" height="390"/><rect x="562" y="170" width="12" height="130"/>
 <rect x="722" y="210" width="12" height="50"/><rect x="894" y="440" width="12" height="80"/>
</g>
<!-- messages -->
<g font-family="Microsoft YaHei,Arial" font-size="10.5" fill="#1b2733" paint-order="stroke" stroke="#fff" stroke-width="3" stroke-linejoin="round">
 <g stroke="#1f4e79" stroke-width="1.4" marker-end="url(#m4a)">
  <line x1="88" y1="132" x2="248" y2="132"/>
  <line x1="248" y1="162" x2="408" y2="162"/>
  <line x1="408" y1="192" x2="568" y2="192"/>
  <line x1="568" y1="222" x2="728" y2="222"/>
  <line x1="88" y1="432" x2="408" y2="432"/>
  <line x1="408" y1="452" x2="900" y2="452"/>
 </g>
 <g stroke="#7a8b9c" stroke-width="1.2" stroke-dasharray="5 4" marker-end="url(#m4b)">
  <line x1="728" y1="252" x2="568" y2="252"/>
  <line x1="568" y1="342" x2="408" y2="342"/>
  <line x1="408" y1="372" x2="248" y2="372"/>
  <line x1="248" y1="402" x2="88" y2="402"/>
  <line x1="900" y1="482" x2="408" y2="482"/>
  <line x1="408" y1="512" x2="88" y2="512"/>
 </g>
 <text x="96" y="126">1 GET /search/?q=baseball&amp;fa=subject:…&amp;sp=1&amp;c=25&amp;fo=json</text>
 <text x="256" y="156">2 缓存未命中 → 转发（校验限流 20 req/min）</text>
 <text x="414" y="186">3 search(q, fa, sp, c, sb, at)</text>
 <text x="574" y="216">4 查询 + 分面计数（受控词表 / 索引字段）</text>
 <text x="600" y="246">5 hits + facet counts（top-N filters）</text>
 <text x="414" y="336">6 facets[] + pagination{} + results[ItemSummary]</text>
 <text x="256" y="366">7 表述序列化：JSON / YAML / HTML（同一 URI）</text>
 <text x="96" y="396">8 200 + 可缓存响应（pagination.next / facets[].on 为下一跳 URL）</text>
 <text x="96" y="426">9 GET /item/{id}/?fo=json&amp;at=item,resources（用 results[i].id）</text>
 <text x="416" y="446">10 载入 item + resources[] → Assembler</text>
 <text x="470" y="476">11 item + resources[] + files[] + cite_this + rights</text>
 <text x="96" y="506">12 200：含 image_url / IIIF identifier / pdf / word_coordinates</text>
</g>
<!-- alt frame -->
<rect x="30" y="530" width="940" height="66" rx="4" fill="none" stroke="#8a97a6" stroke-width="1.2" stroke-dasharray="6 4"/>
<path d="M30 530 L112 530 L128 552 L30 552 Z" fill="#f2f5f9" stroke="#8a97a6" stroke-width="1.2"/>
<text x="38" y="547" font-family="Microsoft YaHei,Arial" font-size="10.5" font-weight="bold" fill="#41556b">alt</text>
<g font-family="Microsoft YaHei,Arial" font-size="10.5" fill="#41556b">
 <text x="44" y="572">[access_restricted = true] 仅返回书目描述或低清缩略图；[access_restricted = false] 返回完整 resources[] 与文件链接</text>
 <text x="44" y="590">[子站未由 API 实现] 无 JSON 表述，需改用传统网页抓取或独立服务（NLS / PPOC / id.loc.gov 等）</text>
</g>
<g font-family="Microsoft YaHei,Arial" font-size="10.5" fill="#6b7c8f">
 <text x="20" y="620">课程对照：D2 BCE 协作；D3 控制器只编排不存状态；I3 无状态且可缓存；I5 超媒体链接；I1 GET 幂等安全。</text>
 <text x="20" y="638">关键观察：HTML 与 JSON 走同一路径，仅在「表述序列化」处分支——这是「接口层 = 表述层」而非「另建一套 API」的架构决策。</text>
</g>
</svg>