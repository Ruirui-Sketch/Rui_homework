<g font-size="10.5" fill="#6b7c8f">
 <text x="20" y="580">官方公开事实：三类微服务各有独立速率上限；主应用 API 20 次/分钟；存储服务 150 次/分钟；MARCXML 30 次/分钟。</text>
 <text x="20" y="602">课程对照：A3 应用节点无状态 → 可水平扩展；A6 媒体服务按能力拆分独立限流 → 故障隔离；A8 遗留节点通过重定向渐进退役。</text>
 <text x="20" y="624">推断项：主应用具体语言/框架、索引引擎产品、存储实现均未公开，图中只给出可观察的节点职责与域名边界。</text>
</g>
