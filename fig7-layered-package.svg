<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 580" width="1000" height="580" role="img" aria-label="loc.gov 分层架构包图">
<defs><marker id="m7a" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 z" fill="#1f4e79"/></marker></defs>
<rect x="0" y="0" width="1000" height="580" fill="#fff"/>
<text x="20" y="26" font-size="16" font-weight="bold" fill="#1f4e79" font-family="Microsoft YaHei,Arial">图 7　包图 / 分层图：loc.gov 的五层架构与横切关注点</text>
<g font-family="Microsoft YaHei,Arial">
<!-- layer boxes -->
<g fill="#eef4fa" stroke="#2c6da6" stroke-width="1.5">
 <rect x="40" y="60" width="770" height="76" rx="4"/><rect x="40" y="150" width="770" height="76" rx="4"/>
 <rect x="40" y="240" width="770" height="76" rx="4"/><rect x="40" y="330" width="770" height="76" rx="4"/>
 <rect x="40" y="420" width="770" height="90" rx="4"/>
</g>
<!-- package tabs -->
<g fill="#dceafb" stroke="#2c6da6" stroke-width="1.2">
 <rect x="40" y="48" width="120" height="14"/><rect x="40" y="138" width="120" height="14"/>
 <rect x="40" y="228" width="120" height="14"/><rect x="40" y="318" width="120" height="14"/>
 <rect x="40" y="408" width="120" height="14"/>
</g>
<g font-size="10" fill="#2c6da6"><text x="46" y="59">«layer» L1</text><text x="46" y="149">«layer» L2</text><text x="46" y="239">«layer» L3</text><text x="46" y="329">«layer» L4</text><text x="46" y="419">«layer» L5</text></g>
<g font-size="14" font-weight="bold" fill="#1f4e79">
 <text x="60" y="90">接入层　Access / Edge</text><text x="60" y="180">表现层　Presentation</text>
 <text x="60" y="270">应用层　Application / Control</text><text x="60" y="360">领域层　Domain Model</text>
 <text x="60" y="450">基础设施层　Infrastructure</text>
</g>
<g font-size="11" fill="#41556b">
 <text x="60" y="112">HTTPS / TLS、CDN 与边缘缓存、限流与 429、遗留 URL 重定向、爬虫 sitemap 入口</text>
 <text x="60" y="202">HTML 视图模板、JSON / YAML 序列化、IIIF 查看器、sitemap.xml 生成器（同一 URI 多表述）</text>
 <text x="60" y="292">查询构造、分面与分页、条目/资源装配、引用生成、访问守卫、字段投影（at）</text>
 <text x="60" y="382">Collection / Item / Resource / Segment / DigitalFile、Rights、Facet、受控词表、生命周期状态</text>
 <text x="60" y="472">搜索索引、元数据仓储、对象存储、ETL 摄入、IIIF 图像 / OCR / 流媒体服务、外部权威系统</text>
 <text x="60" y="492" fill="#6b7c8f">（独立部署：tile.loc.gov / cdn.loc.gov / id.loc.gov / catalog.loc.gov / api.congress.gov）</text>
</g>
<!-- cross cutting -->
<rect x="836" y="60" width="144" height="450" rx="5" fill="#fff6e9" stroke="#b2600f" stroke-width="1.5"/>
<text x="850" y="86" font-size="12" font-weight="bold" fill="#b2600f">横切关注点</text>
<g font-size="10.5" fill="#8a5312">
 <text x="850" y="126">安全与限流</text><text x="850" y="150">（20/150/60 req·min⁻¹）</text>
 <text x="850" y="192">缓存策略</text><text x="850" y="216">（URI 即缓存键）</text>
 <text x="850" y="258">日志 / 监控 / 配额</text>
 <text x="850" y="300">标准与规范</text>
 <text x="850" y="324">IIIF · RDF · MARC</text>
 <text x="850" y="348">MODS · ALTO · DjVu</text>
 <text x="850" y="372">sitemap · HLS</text>
 <text x="850" y="414">错误处理</text><text x="850" y="438">（429 / CAPTCHA）</text>
 <text x="850" y="480">契约与文档</text>
</g>
<!-- dependency arrows -->
<g stroke="#1f4e79" stroke-width="1.6" fill="none" marker-end="url(#m7a)">
 <line x1="32" y1="98" x2="32" y2="466"/>
</g>
<g font-size="10" fill="#1f4e79" paint-order="stroke" stroke="#fff" stroke-width="3" stroke-linejoin="round">
 <text x="22" y="290" transform="rotate(-90 22 290)">允许的依赖方向（自上而下）</text>
</g>
<!-- 表述分支点：改为 L2 框内右侧标签，避免竖排文字压在层框边框上 -->
<g>
 <rect x="692" y="166" width="108" height="20" rx="10" fill="#fff6e9" stroke="#b2600f" stroke-width="1"/>
 <text x="746" y="180" text-anchor="middle" font-family="Microsoft YaHei,Arial" font-size="9.5" fill="#8a5312">多表述分支点</text>
</g>
<g font-family="Microsoft YaHei,Arial" font-size="10.5" fill="#6b7c8f">
 <text x="20" y="534">依赖倒置（DIP）：领域层只定义 Repository / 表述接口，由基础设施层实现；因此更换检索引擎或存储不改变领域模型。</text>
 <text x="20" y="554">对照 A1 分层与关注点分离、A4 读写分离、A5 缓存、A7 标准互操作；「同一 URI 多表述」使 L2 成为唯一的表述分支点。</text>
</g>
</g>
</svg>