<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 470" width="1000" height="470" role="img" aria-label="API 请求处理状态机图">
<defs><marker id="m3a" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 z" fill="#1f4e79"/></marker></defs>
<rect x="0" y="0" width="1000" height="470" fill="#fff"/>
<text x="20" y="26" font-size="16" font-weight="bold" fill="#1f4e79" font-family="Microsoft YaHei,Arial">图 3　状态机图 B：一次 JSON/YAML API 请求的处理状态</text>
<g font-family="Microsoft YaHei,Arial" font-size="11.5">
<g fill="#eaf2fb" stroke="#2c6da6" stroke-width="1.5">
 <rect x="30" y="120" width="132" height="66" rx="11"/><rect x="182" y="120" width="140" height="66" rx="11"/>
 <rect x="342" y="120" width="132" height="66" rx="11"/><rect x="494" y="120" width="132" height="66" rx="11"/>
 <rect x="646" y="120" width="132" height="66" rx="11"/><rect x="798" y="120" width="170" height="66" rx="11"/>
</g>
<g fill="#1b2733" font-weight="bold" font-size="12">
 <text x="44" y="147">已接收</text><text x="196" y="147">参数解析/校验</text><text x="356" y="147">限流判定</text>
 <text x="508" y="147">查询构造</text><text x="660" y="147">索引检索</text><text x="812" y="147">表述组装</text>
</g>
<g fill="#41556b" font-size="10">
 <text x="44" y="167">GET /{endpoint}</text><text x="196" y="167">fo/q/fa/sp/c/sb/at</text><text x="356" y="167">配额计数器</text>
 <text x="508" y="167">Specification 对象</text><text x="660" y="167">hits + facets</text><text x="812" y="167">JSON / YAML / HTML</text>
</g>
<g fill="#fdf0ed" stroke="#a3312a" stroke-width="1.4">
 <rect x="30" y="290" width="140" height="62" rx="11"/><rect x="190" y="290" width="160" height="62" rx="11"/>
 <rect x="370" y="290" width="160" height="62" rx="11"/><rect x="550" y="290" width="160" height="62" rx="11"/>
</g>
<g fill="#1b2733" font-weight="bold" font-size="12">
 <text x="44" y="316">400 参数错误</text><text x="204" y="316">429 / CAPTCHA</text><text x="384" y="316">404 / 空结果</text><text x="564" y="316">503 / 降级</text>
</g>
<g fill="#8a3a33" font-size="10">
 <text x="44" y="336">非法 fo / sp / c</text><text x="204" y="336">封禁 1 小时</text>
 <text x="384" y="336">子站未提供 API</text><text x="564" y="336">深分页超限 (&gt;100k)</text>
</g>
<rect x="740" y="290" width="228" height="62" rx="11" fill="#e7f5ec" stroke="#1f7a4d" stroke-width="1.5"/>
<text x="754" y="316" font-weight="bold" font-size="12" fill="#1b2733">已响应 / 可缓存</text>
<text x="754" y="336" font-size="10" fill="#1f7a4d">200 + Cache-Key = 完整 URI</text>
</g>
<g stroke="#1f4e79" stroke-width="1.5" fill="none" marker-end="url(#m3a)" font-family="Microsoft YaHei,Arial">
 <line x1="162" y1="153" x2="182" y2="153"/><line x1="322" y1="153" x2="342" y2="153"/>
 <line x1="474" y1="153" x2="494" y2="153"/><line x1="626" y1="153" x2="646" y2="153"/><line x1="778" y1="153" x2="798" y2="153"/>
 <line x1="883" y1="186" x2="854" y2="290"/>
 <line x1="252" y1="186" x2="100" y2="290"/><line x1="408" y1="186" x2="270" y2="290"/>
 <line x1="712" y1="186" x2="630" y2="290"/><line x1="560" y1="186" x2="450" y2="290"/>
</g>
<g font-family="Microsoft YaHei,Arial" font-size="10" fill="#41556b" paint-order="stroke" stroke="#fff" stroke-width="3" stroke-linejoin="round">
 <text x="152" y="110">校验</text><text x="312" y="110">通过</text><text x="452" y="110">[未超限]</text>
 <text x="612" y="110">查询</text><text x="764" y="110">命中</text>
 <text x="886" y="240">序列化完成</text>
 <text x="70" y="238">[非法参数]</text><text x="322" y="262">[超 20 req/min]</text>
 <text x="490" y="246" text-anchor="end">[无匹配]</text><text x="640" y="274" text-anchor="end">[索引过载]</text>
</g>
<path d="M270 352 L270 400 L14 400 L14 175 L30 175" fill="none" stroke="#7a8b9c" stroke-width="1.3" stroke-dasharray="5 4" marker-end="url(#m3a)"/>
<text x="56" y="392" font-family="Microsoft YaHei,Arial" font-size="10" fill="#6b7c8f">[等待 Retry-After 后重试]</text>
<circle cx="20" cy="153" r="9" fill="#1f4e79"/>
<circle cx="980" cy="321" r="10" fill="none" stroke="#1f4e79" stroke-width="1.5"/><circle cx="980" cy="321" r="5" fill="#1f4e79"/>
<g font-family="Microsoft YaHei,Arial" font-size="10.5" fill="#6b7c8f">
 <text x="20" y="430">课程对照：A3 无状态（请求结束即释放，不保留会话）；A9 限流公开；I7 错误语义——429 与 CAPTCHA/HTML 混用是明显缺陷。</text>
 <text x="20" y="450">官方建议客户端在遇到 429 或 CAPTCHA 时暂停重试；这正是状态机中「等待后重试」回边来源。</text>
</g>
</svg>